<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/marswalk.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarsWalk</title>
    <meta name="description" content="Interactive Jezero Crater exploration planner, scientific observation notebook, and simulated speed-of-light communication delay coordinator with NASA evidence." />
    <meta property="og:title" content="MarsWalk" />
    <meta property="og:description" content="Interactive Jezero Crater exploration planner, scientific observation notebook, and simulated speed-of-light communication delay coordinator with NASA evidence." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarsWalk" />
    <meta name="twitter:description" content="Interactive Jezero Crater exploration planner, scientific observation notebook, and simulated speed-of-light communication delay coordinator with NASA evidence." />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #05060a;
        color: #f3f1ee;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
      @keyframes mw-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes mw-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      window.addEventListener('error', function(event) {
        console.error('[MarsWalk Error]', event.error || event.message);
        var errBox = document.getElementById('runtime-error-banner');
        if (!errBox && document.body) {
          errBox = document.createElement('div');
          errBox.id = 'runtime-error-banner';
          errBox.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;z-index:99999;background:#2b1111;color:#fca5a5;border:1px solid #ef4444;border-radius:8px;padding:14px;font-family:monospace;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,0.8);white-space:pre-wrap;';
          document.body.appendChild(errBox);
        }
        if (errBox) {
          errBox.textContent = 'Application Error: ' + (event.error ? (event.error.stack || event.error.message) : event.message);
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">
  </head>
  <body>
    <div id="root">
      <div id="marswalk-initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05060a;color:#f3f1ee;z-index:9999;text-align:center;padding:20px;">
        <div style="width:36px;height:36px;border:2px solid rgba(255,255,255,0.15);border-top-color:#fbbf24;border-radius:50%;animation:mw-spin 0.8s linear infinite;"></div>
        <div style="margin-top:16px;font-size:12px;font-weight:700;letter-spacing:0.25em;color:#f3f1ee;">MARSWALK</div>
        <div style="margin-top:6px;font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.05em;">Opening your mission workspace…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
